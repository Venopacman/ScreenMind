[build-system]
requires = ["setuptools>=64,<75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "screenmind"
dynamic = ["version"]
description = "Privacy-first AI screen activity journal -- captures, analyzes, and searches your screen history using Gemma 4, 100% locally."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.14"
authors = [
    {name = "Ayush Shekhar"},
]
keywords = ["screen-capture", "ai", "privacy", "gemma", "local-ai", "activity-tracker", "llm", "vision"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Desktop Environment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Graphics :: Capture :: Screen Capture",
]

dependencies = [
    # Core
    "fastapi>=0.115.6,<1.0",
    "uvicorn[standard]>=0.34.0,<1.0",
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.0,<3.0",
    "python-dotenv>=0.21,<2.0",

    # Screen Capture
    "mss>=9.0,<10.0",
    "Pillow>=10.0,<13.0",
    "imagehash>=4.3,<5.0",

    # HTTP client (for llama-server communication)
    "httpx>=0.28.0,<1.0",

    # Numerical
    "numpy>=1.26,<3.0",

    # OCR on ONNX Runtime (CPU, no PyTorch)
    "rapidocr>=3.9,<4.0",
    "onnxruntime>=1.18,<2.0",
    "huggingface_hub>=0.20,<2.0",  # model downloads (Gemma)

    # Audio / Meeting Transcription
    "sounddevice>=0.5,<1.0",

    # Encryption (optional but included by default)
    "cryptography>=41.0,<50.0",
    "keyring>=23.0",

    # macOS: window detection, accessibility text and UI events (AppKit, Quartz, AXUIElement)
    "pyobjc-framework-Cocoa>=10.0 ; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10.0 ; sys_platform == 'darwin'",
    "pyobjc-framework-ApplicationServices>=10.0 ; sys_platform == 'darwin'",
    # macOS: screenshots via ScreenCaptureKit (capture/sck.py)
    "pyobjc-framework-ScreenCaptureKit>=10.0 ; sys_platform == 'darwin'",

    # Windows: accessibility text and UI events (UI Automation)
    "uiautomation>=2.0,<3.0 ; sys_platform == 'win32'",
]

[project.optional-dependencies]
# OCR is a core dependency now (ONNX Runtime, no PyTorch).
# Kept so `pip install screenmind[ai]` still works.
ai = []

# Windows accessibility API. Now a core dependency on Windows; kept so
# `pip install screenmind[windows]` still works.
windows = ["uiautomation>=2.0,<3.0 ; sys_platform == 'win32'"]

[dependency-groups]
# Development / testing. `uv sync` installs this group by default.
dev = [
    "pytest>=7.0",
    "pytest-asyncio",
    "pytest-cov",
    "flake8",
    "flake8-print",
]


[project.scripts]
screenmind = "screenmind.main:run"

[project.urls]
Homepage = "https://screenmind.pages.dev"
Repository = "https://github.com/ayushh0110/ScreenMind"
Documentation = "https://github.com/ayushh0110/ScreenMind#readme"
Changelog = "https://github.com/ayushh0110/ScreenMind/releases"
Issues = "https://github.com/ayushh0110/ScreenMind/issues"

[tool.setuptools.packages.find]
include = ["screenmind", "screenmind.*"]
exclude = ["tests", "tests.*"]

[tool.setuptools.package-data]
screenmind = [
    "py.typed",
    "api/static/**/*",
    "api/static/css/*",
    "api/static/js/*",
    "api/static/index.html",
    "assets/*",
]

[tool.setuptools.dynamic]
version = {attr = "screenmind.__version__"}



# ── Pytest ────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

# ── uv ────────────────────────────────────────────────────────────────
[tool.uv]
# The lock must have wheels for these platforms. Without this, uv may lock a
# version that has no wheel for one of them (it checks the platform tag only,
# not the Python version).
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
