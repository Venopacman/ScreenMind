name: CI

on:
  push:
    branches: [main, custom]
  pull_request:
    branches: [main, custom]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Lowest supported Python. The lock covers 3.10+.
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.10"
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Full locked install: project, mcp extra (via the dev group) and dev tools.
      # --locked fails if uv.lock is out of date with pyproject.toml.
      - name: Install dependencies
        run: uv sync --locked

      - name: Lint JavaScript (syntax check)
        run: |
          $failed = $false
          Get-ChildItem screenmind/api/static/js/*.js | ForEach-Object {
            Write-Host "Checking $($_.Name)..."
            node --check $_.FullName 2>&1
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { exit 1 }

      - name: Lint — no bare print() in source
        run: |
          uv run --locked flake8 --select=T201 --exclude=.venv,tests/,screenmind/ui/overlay.py,screenmind/setup_llama.py,screenmind/setup_wizard.py .

      - name: Run tests with coverage
        run: |
          uv run --locked pytest --cov=screenmind --cov-report=term-missing --cov-report=xml -q

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
