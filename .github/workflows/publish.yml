name: Publish to PyPI

# Publishes a release to PyPI when you push a version tag, e.g.:
#   git tag v0.2.1
#   git push origin v0.2.1
#
# Why tags (not every push): PyPI rejects re-uploading an existing version,
# so publishing on every push would fail unless the version changed. A tag is
# an explicit "cut a release now" signal and keeps the version in one place.

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v6

      - name: Verify tag matches package version
        run: |
          PKG_VERSION=$(python -c "import re, pathlib; t = pathlib.Path('screenmind/__init__.py').read_text(); print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', t).group(1))")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "package __version__ = $PKG_VERSION | tag = $TAG_VERSION"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag '$TAG_VERSION' does not match screenmind.__version__ '$PKG_VERSION'. Bump the version in screenmind/__init__.py and re-tag."
            exit 1
          fi

      - name: Build sdist and wheel
        run: uv build

      - name: Check metadata
        run: uvx twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Trusted publishing: PyPI must have a publisher configured for this repo,
    # workflow (publish.yml) and environment (pypi). No API token needed.
    environment:
      name: pypi
      url: https://pypi.org/project/screenmind/
    permissions:
      id-token: write  # required for OIDC trusted publishing
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
